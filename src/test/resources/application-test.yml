spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kctm_db?stringtype=unspecified
    username: kct_test
    password: kct_test
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

logging:
  level:
    com.kamercinetalents.manager: WARN
    org.springframework.security: WARN

app:
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-signing
    expiration-ms: 86400000
