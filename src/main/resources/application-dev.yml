spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/kctm_db
    username: ${DB_USER:kct_dev}
    password: ${DB_PASSWORD:kct_dev}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.kamercinetalents.manager: DEBUG
    org.springframework.security: DEBUG
